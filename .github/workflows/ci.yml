name: VISTAAR Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Validation & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install httpx pytest pytest-asyncio email-validator

      - name: Run Backend Integration & Health Tests
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb+srv://ayushmang06_db_user:1234567890@polarbearvistaar.qmtf9h5.mongodb.net/?appName=polarbearVISTAAR' }}
          MONGODB_DB_NAME: vistaar_test
          USE_IN_MEMORY_QUEUE: "true"
        run: |
          python -m pytest tests/

  frontend-build:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Typecheck & Build Next.js Application
        working-directory: ./apps/web
        run: npm run build
